name: Publish gem to GitHub Packages

# Triggered by merges to main rather than a manually-pushed tag, so releasing
# doesn't require a human to run bin/publish_gem locally and tag the release
# by hand (see README's CI and Releasing section).
#
# Whether a merge warrants a release is decided by the version bump itself:
# bumping lib/sso_openid/version.rb is a judgment call made by the PR author
# (this repo has no semver/Conventional Commits policy to infer it from),
# not something this workflow decides. It only checks whether the current
# VERSION already has a matching gem-v<version> tag and skips publishing
# when a merge didn't change it.
#
# Runs with the workflow's own GITHUB_TOKEN, which (unlike a personal access
# token) is allowed to create/update a package under this repo even when org
# policy restricts members from creating packages themselves, and (with
# contents: write below) can push the release tag itself.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'

      - name: Check whether this version was already published
        id: check
        run: |
          VERSION="$(ruby -r ./lib/sso_openid/version -e 'puts SsoOpenid::VERSION')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/gem-v${VERSION}" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure gem credentials
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials <<CREDS
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          CREDS
          chmod 0600 ~/.gem/credentials

      - name: Build and publish
        if: steps.check.outputs.publish == 'true'
        run: bin/publish_gem

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "gem-v${{ steps.check.outputs.version }}"
          git push origin "gem-v${{ steps.check.outputs.version }}"
